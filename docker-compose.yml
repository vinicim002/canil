services:
  postgres:
    image: postgres:16
    container_name: canil_postgres
    environment:
      POSTGRES_DB: canil_db
      POSTGRES_USER: canil_user
      POSTGRES_PASSWORD: canil_pass
    ports:
      - "5433:5432"
    volumes:
      - canil_postgres_data:/var/lib/postgresql/data
    networks:
      - canil_net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: canil_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@canil.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - canil_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: canil_redis
    command: redis-server --appendonly yes
    volumes:
      - canil_redis_data:/data
    networks:
      - canil_net
    restart: unless-stopped

  evolution-postgres:
    image: postgres:16
    container_name: canil_evolution_postgres
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_pass
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - canil_net
    restart: unless-stopped

  evolution-manager:
    image: evoapicloud/evolution-manager:latest
    container_name: canil_evolution_manager
    ports:
      - "3000:80"
    depends_on:
      - evolution-api
    networks:
      - canil_net
    restart: unless-stopped

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: canil_evolution
    ports:
      - "8081:8080"
    env_file:
      - evolution.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://host.docker.internal:8081
      AUTHENTICATION_API_KEY: canil-evolution-dev-key
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      LANGUAGE: pt-BR
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution_pass@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: canil_evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: Chrome
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1020885143
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - redis
      - evolution-postgres
    networks:
      - canil_net
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: canil_n8n
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: canil_db
      DB_POSTGRESDB_USER: canil_user
      DB_POSTGRESDB_PASSWORD: canil_pass
      N8N_ENCRYPTION_KEY: canil_secret_key_123
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - evolution-api
    networks:
      - canil_net
    restart: unless-stopped

networks:
  canil_net:
    driver: bridge

volumes:
  canil_postgres_data:
  canil_redis_data:
  evolution_postgres_data:
  evolution_instances:
  n8n_data: