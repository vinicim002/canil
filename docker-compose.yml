services:
  postgres:
    image: postgres:16
    container_name: canil_postgres
    environment:
      POSTGRES_DB: canil_db
      POSTGRES_USER: canil_user
      POSTGRES_PASSWORD: canil_pass
    ports:
      - "5433:5432"
    volumes:
      - canil_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: canil_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@canil.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  canil_postgres_data:
