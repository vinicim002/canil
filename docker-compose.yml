services:
  postgres:
    image: postgres:16
    container_name: canil_postgres
    environment:
      POSTGRES_DB: canil_db
      POSTGRES_USER: canil_user
      POSTGRES_PASSWORD: canil_pass
    ports:
      - "5433:5432"
    volumes:
      - canil_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: canil_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@canil.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: canil_n8n
    ports:
      - "5678:5678"

    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo

      # Banco interno do n8n (usa seu postgres existente)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=canil_db
      - DB_POSTGRESDB_USER=canil_user
      - DB_POSTGRESDB_PASSWORD=canil_pass

      # Segurança básica (recomendado)
      - N8N_ENCRYPTION_KEY=canil_secret_key_123

      # URL base (importante pra webhooks)
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  canil_postgres_data:
  n8n_data:
