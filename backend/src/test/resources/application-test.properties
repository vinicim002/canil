spring.application.name=backend-test

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

jwt.secret=test-jwt-secret-key-minimum-256-bits-required-for-hs256
jwt.expiration=3600000
jwt.refresh-expiration=86400000

app.cors.allowed-origins=http://localhost:5173
app.cors.max-age=3600

app.mail.enabled=false
app.mail.provider=smtp
app.mail.from=test@canil.test
app.mail.admin=admin@canil.test
app.mail.site-name=Canil Test
app.mail.site-url=http://localhost:5173

app.rate-limit.enabled=false

app.n8n.enabled=true
app.n8n.webhook-secret=test-n8n-webhook-secret
app.n8n.visita-whatsapp-via-evolution-direto=false

app.evolution.enabled=false
app.evolution.base-url=http://localhost:8081
app.evolution.api-key=test-key
app.evolution.instance-name=test

app.canil.whatsapp-numero=5521999999999
app.canil.docs-base-url=http://localhost:8080

cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

app.visita.site-url=http://localhost:5173
app.visita.hora-inicio=09:00
app.visita.hora-fim=17:00
app.visita.duracao-minutos=60
app.visita.antecedencia-minima-horas=1
app.visita.dias-antecedencia-maxima=60
app.visita.dias-permitidos=1,2,3,4,5,6
app.visita.notificar-email=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
