# Banco
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# Porta
server.port=8080

#CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.max-age=3600

app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM}
app.mail.admin=${MAIL_ADMIN}
app.mail.site-name=${MAIL_SITE_NAME:Canil Alto da Bela Vista}
app.mail.site-url=${MAIL_SITE_URL}

app.visita.site-url=${VISITA_SITE_URL:${MAIL_SITE_URL}}
app.visita.whatsapp-site-url=${VISITA_WHATSAPP_SITE_URL:${VISITA_SITE_URL:${MAIL_SITE_URL}}}
app.visita.management-path=/agendamento
app.visita.hora-inicio=09:00
app.visita.hora-fim=17:00
app.visita.duracao-minutos=60
app.visita.antecedencia-minima-horas=24
app.visita.dias-antecedencia-maxima=60
app.visita.dias-permitidos=1,2,3,4,5,6
app.visita.lembrete-horas-antes=${VISITA_LEMBRETE_HORAS:24}
app.visita.notificar-email=${VISITA_NOTIFICAR_EMAIL:true}

app.n8n.enabled=${N8N_ENABLED:true}
app.n8n.webhook-secret=${N8N_WEBHOOK_SECRET}
app.n8n.webhook-url-visita=${N8N_WEBHOOK_URL_VISITA:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true