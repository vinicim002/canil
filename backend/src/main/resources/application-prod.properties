# Banco
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA + Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Railway define PORT dinamicamente
server.port=${PORT:8080}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.max-age=3600

# E-mail — smtp (Gmail) ou resend (MAIL_PROVIDER)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:noreply@canil.local}
app.mail.admin=${MAIL_ADMIN:admin@canil.local}
app.mail.site-name=${MAIL_SITE_NAME:Canil Alto da Bela Vista}
app.mail.site-url=${MAIL_SITE_URL:http://localhost:5173}

# SMTP (Gmail no Railway) — usado quando app.mail.provider=smtp
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Rate limiting
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

# Visitas
app.visita.site-url=${VISITA_SITE_URL:${MAIL_SITE_URL:http://localhost:5173}}
app.visita.whatsapp-site-url=${VISITA_WHATSAPP_SITE_URL:${VISITA_SITE_URL:${MAIL_SITE_URL:http://localhost:5173}}}
app.visita.management-path=/agendamento
app.visita.hora-inicio=09:00
app.visita.hora-fim=17:00
app.visita.duracao-minutos=60
app.visita.antecedencia-minima-horas=24
app.visita.dias-antecedencia-maxima=60
app.visita.dias-permitidos=1,2,3,4,5,6
app.visita.lembrete-horas-antes=${VISITA_LEMBRETE_HORAS:24}
# E-mail de visita segue MAIL_ENABLED se VISITA_NOTIFICAR_EMAIL não for definido
app.visita.notificar-email=${VISITA_NOTIFICAR_EMAIL:${MAIL_ENABLED:false}}

# n8n — desligado por padrão até configurar
app.n8n.enabled=${N8N_ENABLED:false}
app.n8n.webhook-secret=${N8N_WEBHOOK_SECRET:change-me-in-production}
app.n8n.webhook-url-visita=${N8N_WEBHOOK_URL_VISITA:}
app.n8n.webhook-url-filhote-resposta=${N8N_WEBHOOK_URL_FILHOTE:}
app.n8n.filhote-resposta-via-n8n=${N8N_FILHOTE_VIA_N8N:false}
app.n8n.visita-whatsapp-via-evolution-direto=${N8N_VISITA_VIA_EVOLUTION:false}
app.n8n.connect-timeout-ms=5000
app.n8n.read-timeout-ms=10000

# Evolution API — EVOLUTION_BASE_URL obrigatória com https:// quando EVOLUTION_ENABLED=true
app.evolution.enabled=${EVOLUTION_ENABLED:false}
app.evolution.base-url=${EVOLUTION_BASE_URL:}
app.evolution.api-key=${EVOLUTION_API_KEY:}
app.evolution.instance-name=${EVOLUTION_INSTANCE:canil}

# Canil (público)
app.canil.whatsapp-numero=${CANIL_WHATSAPP_NUMERO:5521000000000}
app.canil.docs-base-url=${CANIL_DOCS_BASE_URL:http://localhost:8080}

# Cloudinary — placeholders até configurar (upload falha em runtime se inválido)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:placeholder}
cloudinary.api-key=${CLOUDINARY_API_KEY:placeholder}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:placeholder}

# Swagger desabilitado em produção
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logs úteis no Railway
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.jdbc=INFO
